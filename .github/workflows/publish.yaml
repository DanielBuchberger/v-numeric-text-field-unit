name: Publish to NPM

on:
  release:
    types: [published]

# Trusted publishing (OIDC): npm accepts this workflow as publisher of the package (configured on npmjs.com, stage
# publish only), no NPM_TOKEN; provenance is attached automatically. The workflow stages the version, a maintainer
# releases it on npmjs.com or with `npm stage approve <stage-id>` (2FA).
permissions:
  id-token: write   # OIDC token for npm
  contents: write   # push of the version commit to release/v<version> (only if package.json did not have it)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set env
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # version from the tag of the published release (v4.2.0 -> 4.2.0), independent of the release title
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$TAG' is not a version (expected e.g. v4.2.0)"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Debug
        run: |
          echo "Release version: ${{env.RELEASE_VERSION}}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        # trusted publishing needs npm >= 11.5.1, staged publishing npm >= 11.15.0
        run: npm install -g npm@^11.15.0 && npm --version

      - name: Create release branch
        run: |
          git checkout -b release/${{env.RELEASE_VERSION}}

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Patch version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name ${GITHUB_ACTOR}
          git config --global user.email "github-actions@github.com"
          git remote add publisher "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "Release version: ${{env.RELEASE_VERSION}}"

          # package.json may already have the version (bumped in the pull request)
          npm version ${{env.RELEASE_VERSION}} --no-git-tag-version --allow-same-version

          if ! git diff --quiet package.json package-lock.json; then
            git commit package.json package-lock.json -m "Updated package.json version to ${{env.RELEASE_VERSION}}"
            git push publisher HEAD:release/v${{env.RELEASE_VERSION}}
          fi

      - name: Stage publish
        # authenticated by trusted publishing (OIDC), no token; the staged version goes live after approval
        run: npm stage publish .
